name: cloud-build
# added-by: cloud-toolbox

on:
  workflow_dispatch:
    inputs:
      note:
        description: "本次编译备注"
        required: false
        default: "triggered by toolbox"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查工程完整性
        run: |
          echo "=== 工程根目录文件 ==="
          ls -la
          if [ ! -f "gradlew" ]; then
            echo "::error::缺少 gradlew（Gradle Wrapper）。请把整个 Android 工程目录上传（含 gradlew、gradle/wrapper/）。"
            exit 1
          fi
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "::warning::没看到 settings.gradle，多模块工程可能编译失败"
          fi

      - name: 识别 AGP 版本并选择 Java 版本
        id: javaver
        run: |
          JVER=17
          AGP=""
          # 从 build.gradle(.kts) 里抓 com.android.tools.build:gradle 版本
          for f in build.gradle build.gradle.kts app/build.gradle app/build.gradle.kts; do
            if [ -f "$f" ]; then
              g=$(grep -rhoE "com\.android\.tools\.build:gradle[^0-9]*[0-9]+\.[0-9]+" "$f" 2>/dev/null | grep -oE "[0-9]+\.[0-9]+" | head -1)
              if [ -n "$g" ]; then AGP="$g"; break; fi
            fi
          done
          # 从 libs.versions.toml 里抓
          if [ -z "$AGP" ] && [ -f "gradle/libs.versions.toml" ]; then
            g=$(grep -iE "agp|androidGradlePlugin|android-gradle" gradle/libs.versions.toml 2>/dev/null | grep -oE "[0-9]+\.[0-9]+" | head -1)
            [ -n "$g" ] && AGP="$g"
          fi
          echo "检测到 AGP 版本: ${AGP:-未知}"
          if [ -n "$AGP" ]; then
            MAJOR=$(echo "$AGP" | cut -d. -f1)
            if [ "$MAJOR" -le 3 ] 2>/dev/null; then JVER=8;
            elif [ "$MAJOR" -le 7 ] 2>/dev/null; then JVER=11;
            else JVER=17; fi
          fi
          echo "选用 Java $JVER"
          echo "jver=$JVER" >> "$GITHUB_OUTPUT"

      - name: 准备 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.javaver.outputs.jver }}

      - name: 准备 Android SDK 并接受许可
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: 调整 Gradle 内存（小内存 runner 避免 OOM）
        run: |
          if [ -f gradle.properties ]; then
            if ! grep -q "org.gradle.jvmargs" gradle.properties; then
              echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
            fi
          else
            echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          fi
          cat gradle.properties

      - name: 给 gradlew 执行权限
        run: chmod +x ./gradlew || true

      - name: 编译 Debug APK（免签名，可直接安装）
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 收集所有 APK（含多模块）
        run: |
          mkdir -p out
          find . -type f -name "*.apk" -not -path "./out/*" -not -path "*/build/intermediates/*" -exec cp {} out/ \; || true
          # 重名处理
          cd out && for f in *.apk; do [ -f "$f" ] && mv "$f" "$(echo $f | tr '/' '_')" 2>/dev/null; done; cd ..
          echo "=== 找到的 APK ==="
          ls -la out || true

      - name: 上传 APK 产物
        if: ${{ hashFiles('out/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/**
          if-no-files-found: warn
